{% extends "base.html" %}
{% block main %}
  {% if session %}<p class="back"><a href="/sessions/{{ session.id }}">← Back to the plan</a></p>{% endif %}
  <h1>{{ "Session details" if session else "New session" }}</h1>
  {% if errors %}<div class="banner warn">{% for e in errors %}<p>{{ e }}</p>{% endfor %}</div>{% endif %}
  <form method="post" action="{{ '/sessions/%d' % session.id if session else '/sessions' }}" class="form">
    <div class="grid-2">
      <label>Date <input type="date" name="date" value="{{ values.date }}" required></label>
      <label>Start time <input type="time" name="start_time" value="{{ values.start_time }}" required></label>
    </div>
    <label>Goal for the session
      <span class="hint">Everything in the plan links back to this.</span>
      <textarea name="goal" rows="3" placeholder="e.g. Win the breakdown: low body height and fast second arrival">{{ values.goal }}</textarea>
    </label>
    {% if session %}
      <label>Session notes <span class="muted">— coaches only: turnout, how it went overall</span>
        <textarea name="notes" rows="3">{{ values.notes }}</textarea>
      </label>
    {% endif %}
    <div class="actions"><button class="primary">{{ "Save" if session else "Create session" }}</button></div>
  </form>
{% endblock %}
